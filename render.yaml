services:
  - type: web
    name: buildai
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --preload"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "buildai.acoderm.uz,buildai-oehw.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://buildai.acoderm.uz,https://buildai-oehw.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ACCOUNT_DEFAULT_HTTP_PROTOCOL
        value: "https"