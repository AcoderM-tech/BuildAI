services:
  - type: web
    name: buildai
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "buildai.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://buildai.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: buildai-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: buildai-db
    databaseName: buildai
    plan: free
    region: frankfurt
